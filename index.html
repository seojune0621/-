<!DOCTYPE html>
<html lang="ko">
<head><title>서준과의 친함 테스트</title>
<meta property="og:title" content="서준과의 친함 테스트">
<meta property="og:description" content="나는 과연 서준과 얼마나 친할까?">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>서준과의 친함 테스트</title>

<meta name="description" content="나는 과연 서준과 얼마나 친할까?">

<meta property="og:title" content="서준과의 친함 테스트">
<meta property="og:description" content="나는 과연 서준과 얼마나 친할까?">
<meta property="og:type" content="website">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101014;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  text-align: center;
}

.box {
  width: 90%;
  max-width: 400px;
  padding: 35px 22px;
  background: #1d1d27;
  border: 1px solid #39394c;
  border-radius: 20px;
}

h2 {
  font-size: 24px;
}

p {
  color: #bbb;
  line-height: 1.6;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: 0;
  border-radius: 10px;
  background: #7545d8;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

button:active {
  opacity: .7;
}

#ip {
  font-size: 23px;
  color: #b99aff;
  word-break: break-all;
}
</style>
</head>

<body>

<div class="box">

<h2 id="title">서준과 친합니까?</h2>

<p id="description">
서준과의 친함 테스트
</p>

<div id="buttons">
<button onclick="answer(true)">응</button>
<button onclick="answer(false)">아니</button>
</div>

</div>

<script>

let step = 0;

function show(title, description, options) {

  document.getElementById("title").innerText = title;

  document.getElementById("description").innerText =
    description || "";

  const area = document.getElementById("buttons");

  area.innerHTML = "";

  options.forEach(option => {

    const button = document.createElement("button");

    button.innerText = option.text;

    button.onclick = option.action;

    area.appendChild(button);

  });

}

function leave() {

  show(
    "테스트 종료",
    "참여해줘서 고마워요!",
    []
  );

}

function answer(yes) {

  if (step === 0) {

    if (!yes) return leave();

    step = 1;

    show("서준은 잘생겼읍니까?", "", [
      {text:"응", action:()=>answer(true)},
      {text:"아니", action:()=>leave()}
    ]);

  }

  else if (step === 1) {

    if (!yes) return leave();

    step = 2;

    show("서준은 똥쟁이입니까?", "", [
      {text:"응", action:()=>leave()},
      {text:"아니", action:()=>answer(false)}
    ]);

  }

  else if (step === 2) {

    if (yes) return leave();

    step = 3;

    show("서준은 못상겼읍니까?", "", [
      {text:"응", action:()=>leave()},
      {text:"아니", action:()=>answer(false)}
    ]);

  }

  else if (step === 3) {

    if (yes) return leave();

    step = 4;

    show("서준을 신뢰합니까?", "", [
      {text:"응", action:()=>showIP()},
      {text:"아니", action:()=>why()}
    ]);

  }

}

function why() {

  show("왜?", "", [
    {text:"그냥", action:()=>showIP()},
    {text:"몰라", action:()=>showIP()},
    {text:"너가 싫어", action:()=>showIP()}
  ]);

}

function showIP() {

  show(
    "IP 주소 확인",
    "다음 버튼을 누르면 현재 접속 기기의 공인 IP 주소가 표시됩니다.",
    [
      {text:"IP 확인하기", action:fetchIP}
    ]
  );

}

async function fetchIP() {

  document.getElementById("description").innerText =
    "IP 주소 확인 중...";

  document.getElementById("buttons").innerHTML = "";

  try {

    const response = await fetch(
      "https://api.ipify.org?format=json"
    );

    const data = await response.json();

    document.getElementById("description").innerText =
      "현재 접속 기기의 공인 IP 주소";

    document.getElementById("buttons").innerHTML =
      '<div id="ip"></div>';

    document.getElementById("ip").innerText =
      data.ip;

  }

  catch {

    document.getElementById("description").innerText =
      "IP 확인에 실패했습니다.";

  }

}

</script>

</body>

</html>
